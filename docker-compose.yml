x-app: &app
  build: .
  image: wolle-economy-viewer:latest
  restart: unless-stopped
  env_file:
    - .env

services:
  app:
    <<: *app
    container_name: wolle-economy-viewer
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  api:
    <<: *app
    container_name: wolle-economy-api
    command:
      - uvicorn
      - wolle_economy.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8506"
      - --no-access-log
    ports:
      - "8506:8506"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8506/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
